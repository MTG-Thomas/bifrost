[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bifrost-sdk"
version = "1.0.0"
description = "Bifrost Platform SDK"
requires-python = ">=3.11"

[project.scripts]
bifrost = "bifrost.cli:main"

[tool.setuptools]
packages = ["bifrost"]

[tool.pytest.ini_options]
addopts = "-ra -q --cov=. --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "**/__init__.py",
    "bifrost.py",
    "bifrost/__main__.py",
    "bifrost/cli.py",
    "bifrost/commands/*",
    "bifrost/tui/*",
    "bifrost/solution_dev/*",
    "bifrost/migrate_*.py",
    "bifrost/_context.py",
    "bifrost/_execution_context.py",
    "bifrost/_logging.py",
    "bifrost/_sync.py",
    "bifrost/_workspace_lock.py",
    "bifrost/_write_buffer.py",
    "bifrost/ai.py",
    "bifrost/api.py",
    "bifrost/client.py",
    "bifrost/config.py",
    "bifrost/credentials.py",
    "bifrost/executions.py",
    "bifrost/files.py",
    "bifrost/git_commands.py",
    "bifrost/integrations.py",
    "bifrost/knowledge.py",
    "bifrost/organizations.py",
    "bifrost/refs.py",
    "bifrost/roles.py",
    "bifrost/skill.py",
    "bifrost/tables.py",
    "bifrost/users.py",
    "bifrost/webhooks.py",
    "src/routers/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:"
]
