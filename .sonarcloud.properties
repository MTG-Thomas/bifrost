# SonarCloud automatic analysis ignores sonar-project.properties. Keep this
# aligned with sonar-project.properties until Sonar is moved to CI-based scan.
sonar.sources=api,apps,client/src
sonar.tests=api/tests,client/e2e,client/src
sonar.test.inclusions=api/tests/**,client/e2e/**,client/src/**/*.test.ts,client/src/**/*.test.tsx
sonar.test.exclusions=api/tests/unit/cli/test_cli_version_check.py
sonar.exclusions=docker-compose.debug.yml,scripts/docs/**,client/e2e/docs/**,api/tests/**,client/e2e/**,client/src/**/*.test.ts,client/src/**/*.test.tsx,client/src/lib/v1.d.ts,client/src/index.css,api/scripts/skill-truth/**,api/src/services/sdk_package/package.json,api/bifrost/solution_dev/proxy.py
sonar.cpd.exclusions=api/tests/**,client/e2e/**,client/src/**/*.test.ts,client/src/**/*.test.tsx,client/src/lib/v1.d.ts
