name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    # Pull requests always run the real required checks. Do not replace these
    # status names with docs-only noop jobs: branch protection matches check
    # names, so duplicate always-green jobs can spoof the gate.
  # GitHub merge queue runs CI on a synthetic ref containing
  # main + queued PRs stacked in queue order. Required status
  # checks must fire on this event or the queue blocks forever
  # waiting on absent statuses.
  merge_group:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: mtg-thomas
  API_IMAGE: bifrost-api
  CLIENT_IMAGE: bifrost-client
  WORKER_IMAGE: bifrost-worker

permissions:
  contents: read

jobs:
  # =============================================================================
  # Lint & Type Check - Fast, gates all builds alongside unit tests
  # =============================================================================
  lint:
    # Skip on push: main — the merge_group run already covered this
    # commit. Still runs on PRs, queue, tag pushes, and workflow_dispatch.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Lint & Type Check
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      # Create .venv at the repo root so pyrightconfig.json's
      # `venvPath: ..` + `venv: .venv` resolves the same way locally and in CI.
      # Install runtime deps from the hash-pinned lock file (Scorecard
      # Pinned-Dependencies); pyright is installed from its own hash-pinned
      # lock because --require-hashes forbids unpinned packages and pyright
      # targets a different Python minor (3.12 here vs 3.14 in production)
      # so it can't share requirements.lock.
      #
      # We deliberately do NOT `pip install --upgrade pip` — actions/setup-python
      # already ships a current pip into the venv and any explicit upgrade
      # would be flagged by Scorecard as an unpinned install.
      - name: Install Python deps into .venv
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --require-hashes -r requirements.lock
          ./.venv/bin/pip install --require-hashes -r requirements-pyright.lock

      - name: Ruff
        working-directory: api
        run: ../.venv/bin/ruff check .

      - name: Pyright
        working-directory: api
        run: ../.venv/bin/pyright

      - name: Pyright strict core
        working-directory: api
        run: ../.venv/bin/pyright -p pyrightconfig.strict.json

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: TypeScript
        working-directory: client
        run: npm run tsc

      - name: ESLint
        working-directory: client
        run: npm run lint

  # =============================================================================
  # Unit Tests - Fast, gates all builds
  # =============================================================================
  test-unit:
    # Skip on push: main — covered by the merge_group run.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Run unit tests
        run: |
          chmod +x test.sh
          ./test.sh stack up
          ./test.sh unit --cov=. --cov-report=xml:/coverage/coverage.xml
          ./test.sh coverage coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: ./coverage.xml
          flags: api
          name: api-coverage
          token: ${{ secrets.CODECOV_TOKEN }}

  # =============================================================================
  # E2E Tests - PR smoke lane, full suite on merge queue/tags/manual dispatch
  # =============================================================================
  test-e2e:
    # Skip on push: main — covered by the merge_group run.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    name: E2E Tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # PRs and semver tags use the smoke suite (same gate as merge review).
      # Full E2E runs on merge_group / manual dispatch until the suite is stable
      # on MTG fork CI — see ongoing git-sync and MCP matrix failures on main.
      - name: Run E2E smoke tests
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
        run: |
          chmod +x test.sh
          ./test.sh stack up
          ./test.sh e2e-smoke

      - name: Run full E2E tests
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          chmod +x test.sh
          ./test.sh stack up
          ./test.sh e2e

      - name: Upload E2E timing and JUnit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a1 # v7.0.1
        with:
          name: e2e-test-artifacts
          path: |
            /tmp/bifrost-*/test-results.xml
            /tmp/bifrost-*/test-runner.log
          if-no-files-found: ignore

  # =============================================================================
  # Dev Build - Every push to main, gated by unit tests only
  # =============================================================================
  build-dev:
    # Only fires on push: main — branch protection + merge queue
    # already gated this commit, so no needs: here.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Build Dev Images
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC for keyless cosign signing
      attestations: write # for actions/attest-build-provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          VERSION=$(./scripts/compute-dev-version.sh)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Surface manifest drift to the job summary. The plugin manifest is
      # updated at tag time (see bifrost-release skill) — between tags the
      # `version` field reflects the last released version, not the current
      # dev version. This step is informational only; it does not fail the
      # build and does not commit anything back. See PR #246 for the
      # rationale (branch protection + commit-back loop avoidance).
      - name: Report plugin manifest drift
        run: |
          MANIFEST_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          DEV_VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## Plugin manifest version"
            echo ""
            echo "- Manifest (.claude-plugin/plugin.json): \`${MANIFEST_VERSION}\`"
            echo "- Computed dev version: \`${DEV_VERSION}\`"
            if [[ "$MANIFEST_VERSION" != "$DEV_VERSION" ]]; then
              echo ""
              echo "Manifest reflects the last tagged release; it advances at tag time via the bifrost-release skill."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.0

      - name: Build and push API dev image
        id: build-api
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.API_IMAGE }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.API_IMAGE }}:dev
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.API_IMAGE }}:sha-${{ steps.version.outputs.short_sha }}
          build-args: |
            BIFROST_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign API dev image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.API_IMAGE }}@${{ steps.build-api.outputs.digest }}

      - name: Attest API dev image provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.API_IMAGE }}
          subject-digest: ${{ steps.build-api.outputs.digest }}
          push-to-registry: true

      - name: Build and push worker dev image
        id: build-worker
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.WORKER_IMAGE }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.WORKER_IMAGE }}:dev
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.WORKER_IMAGE }}:sha-${{ steps.version.outputs.short_sha }}
          build-args: |
            BIFROST_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign worker dev image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.WORKER_IMAGE }}@${{ steps.build-worker.outputs.digest }}

      - name: Attest worker dev image provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.WORKER_IMAGE }}
          subject-digest: ${{ steps.build-worker.outputs.digest }}
          push-to-registry: true
