name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # GitHub merge queue runs CI on a synthetic ref containing
  # main + queued PRs stacked in queue order. Required status
  # checks must fire on this event or the queue blocks forever
  # waiting on absent statuses.
  merge_group:
  workflow_dispatch:

permissions: read-all

env:
  REGISTRY: ghcr.io
  API_IMAGE: mtg-thomas/bifrost-api
  CLIENT_IMAGE: mtg-thomas/bifrost-client
  WORKER_IMAGE: mtg-thomas/bifrost-worker
  CI_API_TEST_IMAGE: mtg-thomas/bifrost-ci-api-dev
  CI_CLIENT_TEST_IMAGE: mtg-thomas/bifrost-ci-client-dev
  CI_PLAYWRIGHT_TEST_IMAGE: mtg-thomas/bifrost-ci-playwright

jobs:
  # =============================================================================
  # Change-aware plan - one exact, inspectable plan shared by every test lane.
  # =============================================================================
  affected-test-plan:
    runs-on: ubuntu-latest
    name: Plan Affected Tests
    permissions:
      contents: read
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      api_quality_mode: ${{ steps.plan.outputs.api_quality_mode }}
      api_quality_targets: ${{ steps.plan.outputs.api_quality_targets }}
      api_unit_mode: ${{ steps.plan.outputs.api_unit_mode }}
      api_unit_targets: ${{ steps.plan.outputs.api_unit_targets }}
      api_e2e_mode: ${{ steps.plan.outputs.api_e2e_mode }}
      api_e2e_targets: ${{ steps.plan.outputs.api_e2e_targets }}
      api_e2e_matrix: ${{ steps.plan.outputs.api_e2e_matrix }}
      client_quality_mode: ${{ steps.plan.outputs.client_quality_mode }}
      client_quality_targets: ${{ steps.plan.outputs.client_quality_targets }}
      client_unit_mode: ${{ steps.plan.outputs.client_unit_mode }}
      client_unit_targets: ${{ steps.plan.outputs.client_unit_targets }}
      client_e2e_mode: ${{ steps.plan.outputs.client_e2e_mode }}
      client_e2e_targets: ${{ steps.plan.outputs.client_e2e_targets }}
      mcp_conformance_mode: ${{ steps.plan.outputs.mcp_conformance_mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build affected test plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base_sha="$PR_BASE_SHA" ;;
            merge_group) base_sha="$MERGE_GROUP_BASE_SHA" ;;
            push) base_sha="$PUSH_BASE_SHA" ;;
            *) base_sha="" ;;
          esac
          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            python3 api/scripts/plan_affected_tests.py \
              --force-comprehensive
          else
            python3 api/scripts/plan_affected_tests.py \
              --base "$base_sha" \
              --head "$GITHUB_SHA"
          fi

      - name: Upload affected test plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: affected-test-plan
          path: ${{ runner.temp }}/affected-test-plan.json
          if-no-files-found: error
          retention-days: 14

  # =============================================================================
  # CI Test Images - Baked dependency/toolchain images for future PR test runs.
  # Source code is still mounted from each PR checkout by docker-compose.test.yml.
  # =============================================================================
  publish-ci-test-images:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    name: Publish CI Test Images
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API CI test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./api/Dockerfile.dev
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.CI_API_TEST_IMAGE }}:main
            ${{ env.REGISTRY }}/${{ env.CI_API_TEST_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=test-api-dev
          cache-to: type=gha,scope=test-api-dev,mode=max

      - name: Build and push client CI test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./client
          file: ./client/Dockerfile.dev
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.CI_CLIENT_TEST_IMAGE }}:main
            ${{ env.REGISTRY }}/${{ env.CI_CLIENT_TEST_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=test-client-dev
          cache-to: type=gha,scope=test-client-dev,mode=max

      - name: Build and push Playwright CI test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./client
          file: ./client/Dockerfile.playwright
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.CI_PLAYWRIGHT_TEST_IMAGE }}:main
            ${{ env.REGISTRY }}/${{ env.CI_PLAYWRIGHT_TEST_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=test-playwright
          cache-to: type=gha,scope=test-playwright,mode=max

  # =============================================================================
  # Lint & Type Check - Fast, gates all builds alongside unit tests
  # =============================================================================
  lint:
    needs: affected-test-plan
    if: always()
    runs-on: ubuntu-latest
    name: Lint & Type Check
    permissions:
      contents: read
    steps:
      - name: Require a valid affected test plan
        if: needs.affected-test-plan.result != 'success'
        run: |
          echo "Affected test planning failed or was cancelled." >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check GitHub Action pins
        run: python3 api/scripts/check_github_action_pins.py

      - name: Check MTG CI boundaries
        run: python3 api/scripts/check_mtg_ci_boundaries.py

      # Codex skill mirrors (plugins/bifrost/skills/, .codex/skills/) are
      # generated from the canonical .claude/skills/ source.
      - name: Codex skill mirrors in sync
        run: |
          chmod +x scripts/sync-codex-skills.sh
          ./scripts/sync-codex-skills.sh
          git diff --exit-code -- plugins/bifrost/skills .codex/skills \
            || { echo "::error::Codex skill mirrors are stale — run scripts/sync-codex-skills.sh and commit."; exit 1; }

      - name: Set up Python
        if: needs.affected-test-plan.outputs.api_quality_mode != 'skip'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Create .venv at the repo root so pyrightconfig.json's
      # `venvPath: ..` + `venv: .venv` resolves the same way locally and in CI.
      # Install runtime deps from the hash-pinned lock file (Scorecard
      # Pinned-Dependencies); pyright is installed from its own hash-pinned
      # lock because --require-hashes forbids unpinned packages and pyright
      # targets a different Python minor (3.12 here vs 3.14 in production)
      # so it can't share requirements.lock.
      #
      # We deliberately do NOT `pip install --upgrade pip` — actions/setup-python
      # already ships a current pip into the venv and any explicit upgrade
      # would be flagged by Scorecard as an unpinned install.
      - name: Install Python deps into .venv
        if: needs.affected-test-plan.outputs.api_quality_mode != 'skip'
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --require-hashes -r requirements.lock
          ./.venv/bin/pip install --require-hashes -r requirements-pyright.lock

      - name: Ruff
        if: needs.affected-test-plan.outputs.api_quality_mode != 'skip'
        working-directory: api
        env:
          QUALITY_MODE: ${{ needs.affected-test-plan.outputs.api_quality_mode }}
          QUALITY_TARGETS: ${{ needs.affected-test-plan.outputs.api_quality_targets }}
        run: |
          if [ "$QUALITY_MODE" = "comprehensive" ]; then
            ../.venv/bin/ruff check .
          else
            mapfile -t targets <<< "$QUALITY_TARGETS"
            if (( ${#targets[@]} == 0 )); then
              echo "Affected API quality lane has no targets." >&2
              exit 1
            fi
            ../.venv/bin/ruff check "${targets[@]}"
          fi

      - name: Pyright
        if: needs.affected-test-plan.outputs.api_quality_mode != 'skip'
        working-directory: api
        env:
          QUALITY_MODE: ${{ needs.affected-test-plan.outputs.api_quality_mode }}
          QUALITY_TARGETS: ${{ needs.affected-test-plan.outputs.api_quality_targets }}
        run: |
          if [ "$QUALITY_MODE" = "comprehensive" ]; then
            ../.venv/bin/pyright
          else
            mapfile -t targets <<< "$QUALITY_TARGETS"
            ../.venv/bin/pyright "${targets[@]}"
          fi

      - name: Set up Node
        if: needs.affected-test-plan.outputs.client_quality_mode != 'skip'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        if: needs.affected-test-plan.outputs.client_quality_mode != 'skip'
        working-directory: client
        run: npm ci

      - name: TypeScript
        if: needs.affected-test-plan.outputs.client_quality_mode != 'skip'
        working-directory: client
        run: npm run tsc

      - name: ESLint
        if: needs.affected-test-plan.outputs.client_quality_mode != 'skip'
        working-directory: client
        env:
          QUALITY_MODE: ${{ needs.affected-test-plan.outputs.client_quality_mode }}
          QUALITY_TARGETS: ${{ needs.affected-test-plan.outputs.client_quality_targets }}
        run: |
          if [ "$QUALITY_MODE" = "comprehensive" ]; then
            npm run lint
          else
            mapfile -t targets <<< "$QUALITY_TARGETS"
            npx eslint "${targets[@]}"
          fi

      - name: Report skipped code quality lanes
        if: needs.affected-test-plan.outputs.api_quality_mode == 'skip' && needs.affected-test-plan.outputs.client_quality_mode == 'skip'
        run: echo "No executable API or client source is in the affected closure."

  # =============================================================================
  # Client Unit Tests (Vitest) - Fast, runs on host Node — no Docker needed.
  # Parallel to Unit Tests; does NOT become the critical path.
  # =============================================================================
  test-client-unit:
    needs: affected-test-plan
    if: always()
    runs-on: ubuntu-latest
    name: Client Unit Tests
    steps:
      - name: Require a valid affected test plan
        if: needs.affected-test-plan.result != 'success'
        run: |
          echo "Affected test planning failed or was cancelled." >&2
          exit 1

      - name: Checkout repository
        if: needs.affected-test-plan.outputs.client_unit_mode != 'skip'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        if: needs.affected-test-plan.outputs.client_unit_mode != 'skip'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        if: needs.affected-test-plan.outputs.client_unit_mode != 'skip'
        working-directory: client
        run: npm ci

      - name: Vitest
        if: needs.affected-test-plan.outputs.client_unit_mode != 'skip'
        working-directory: client
        env:
          TEST_MODE: ${{ needs.affected-test-plan.outputs.client_unit_mode }}
          TEST_TARGETS: ${{ needs.affected-test-plan.outputs.client_unit_targets }}
        run: |
          if [ "$TEST_MODE" = "comprehensive" ]; then
            npm test
          else
            mapfile -t targets <<< "$TEST_TARGETS"
            if (( ${#targets[@]} == 0 )); then
              echo "Affected client unit lane has no targets." >&2
              exit 1
            fi
            npm test -- "${targets[@]}"
          fi

      - name: Report skipped client unit lane
        if: needs.affected-test-plan.outputs.client_unit_mode == 'skip'
        run: echo "Client unit tests are outside the affected closure."

  # =============================================================================
  # Unit Tests - Fast, gates all builds
  # =============================================================================
  test-unit:
    needs: affected-test-plan
    if: always()
    runs-on: ubuntu-latest
    name: Unit Tests
    permissions:
      contents: read
      packages: read
    steps:
      - name: Require a valid affected test plan
        if: needs.affected-test-plan.result != 'success'
        run: |
          echo "Affected test planning failed or was cancelled." >&2
          exit 1

      - name: Checkout repository
        if: needs.affected-test-plan.outputs.api_unit_mode != 'skip'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect test image input changes
        if: needs.affected-test-plan.outputs.api_unit_mode != 'skip'
        id: test-image-inputs
        run: bash scripts/ci/detect-test-image-inputs.sh

      - name: Set up Docker Buildx
        if: needs.affected-test-plan.outputs.api_unit_mode != 'skip'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: needs.affected-test-plan.outputs.api_unit_mode != 'skip'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Prefer baked main images. docker-compose.test.yml still bind-mounts the
      # current checkout, so PR source code is what tests execute.
      - name: Pull API CI test image
        id: pull-api-ci-image
        if: needs.affected-test-plan.outputs.api_unit_mode != 'skip' && steps.test-image-inputs.outputs.api_changed != 'true'
        continue-on-error: true
        env:
          API_CI_IMAGE_REF: ${{ env.REGISTRY }}/${{ env.CI_API_TEST_IMAGE }}:main
        run: |
          docker pull "$API_CI_IMAGE_REF"
          docker tag "$API_CI_IMAGE_REF" bifrost-test-api-dev:latest

      - name: Build API dev image
        if: needs.affected-test-plan.outputs.api_unit_mode != 'skip' && (steps.test-image-inputs.outputs.api_changed == 'true' || steps.pull-api-ci-image.outcome == 'failure' || steps.pull-api-ci-image.outcome == 'skipped')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./api/Dockerfile.dev
          load: true
          tags: bifrost-test-api-dev:latest
          cache-from: type=gha,scope=test-api-dev
          cache-to: type=gha,scope=test-api-dev,mode=max

      - name: Pull client CI test image
        id: pull-client-ci-image
        if: needs.affected-test-plan.outputs.api_unit_mode != 'skip' && steps.test-image-inputs.outputs.client_changed != 'true'
        continue-on-error: true
        env:
          CLIENT_CI_IMAGE_REF: ${{ env.REGISTRY }}/${{ env.CI_CLIENT_TEST_IMAGE }}:main
        run: |
          docker pull "$CLIENT_CI_IMAGE_REF"
          docker tag "$CLIENT_CI_IMAGE_REF" bifrost-test-client-dev:latest

      - name: Build client dev image
        if: needs.affected-test-plan.outputs.api_unit_mode != 'skip' && (steps.test-image-inputs.outputs.client_changed == 'true' || steps.pull-client-ci-image.outcome == 'failure' || steps.pull-client-ci-image.outcome == 'skipped')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./client
          file: ./client/Dockerfile.dev
          load: true
          tags: bifrost-test-client-dev:latest
          cache-from: type=gha,scope=test-client-dev
          cache-to: type=gha,scope=test-client-dev,mode=max

      - name: Run unit tests
        if: needs.affected-test-plan.outputs.api_unit_mode != 'skip'
        env:
          BIFROST_SKIP_BUILD: "1"
          TEST_MODE: ${{ needs.affected-test-plan.outputs.api_unit_mode }}
          TEST_TARGETS: ${{ needs.affected-test-plan.outputs.api_unit_targets }}
        run: |
          chmod +x test.sh
          ./test.sh stack up
          if [ "$TEST_MODE" = "comprehensive" ]; then
            ./test.sh unit --cov=. --cov-report=xml:/coverage/coverage.xml
            ./test.sh coverage coverage.xml
          else
            mapfile -t targets <<< "$TEST_TARGETS"
            if (( ${#targets[@]} == 0 )); then
              echo "Affected API unit lane has no targets." >&2
              exit 1
            fi
            ./test.sh "${targets[@]}"
          fi

      - name: Upload coverage to Codecov
        if: needs.affected-test-plan.outputs.api_unit_mode == 'comprehensive'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          flags: api
          name: api-coverage
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Report skipped API unit lane
        if: needs.affected-test-plan.outputs.api_unit_mode == 'skip'
        run: echo "API unit tests are outside the affected closure."

  # =============================================================================
  # MCP Conformance - the exact-pinned official runner gates the stable subset
  # applicable to Bifrost's authenticated four-tool modern gateway. Broader
  # stateless checks remain visible in the uploaded advisory artifact.
  # =============================================================================
  mcp-conformance:
    needs: affected-test-plan
    if: always()
    runs-on: ubuntu-latest
    name: MCP Conformance
    permissions:
      contents: read
      packages: read
    steps:
      - name: Require a valid affected test plan
        if: needs.affected-test-plan.result != 'success'
        run: |
          echo "Affected test planning failed or was cancelled." >&2
          exit 1

      - name: Checkout repository
        if: needs.affected-test-plan.outputs.mcp_conformance_mode != 'skip'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect test image input changes
        if: needs.affected-test-plan.outputs.mcp_conformance_mode != 'skip'
        id: test-image-inputs
        run: bash scripts/ci/detect-test-image-inputs.sh

      - name: Set up Docker Buildx
        if: needs.affected-test-plan.outputs.mcp_conformance_mode != 'skip'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: needs.affected-test-plan.outputs.mcp_conformance_mode != 'skip'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull API CI test image
        id: pull-api-ci-image
        if: needs.affected-test-plan.outputs.mcp_conformance_mode != 'skip' && steps.test-image-inputs.outputs.api_changed != 'true'
        continue-on-error: true
        env:
          API_CI_IMAGE_REF: ${{ env.REGISTRY }}/${{ env.CI_API_TEST_IMAGE }}:main
        run: |
          docker pull "$API_CI_IMAGE_REF"
          docker tag "$API_CI_IMAGE_REF" bifrost-test-api-dev:latest

      - name: Build API dev image
        if: needs.affected-test-plan.outputs.mcp_conformance_mode != 'skip' && (steps.test-image-inputs.outputs.api_changed == 'true' || steps.pull-api-ci-image.outcome == 'failure' || steps.pull-api-ci-image.outcome == 'skipped')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./api/Dockerfile.dev
          load: true
          tags: bifrost-test-api-dev:latest
          cache-from: type=gha,scope=test-api-dev
          cache-to: type=gha,scope=test-api-dev,mode=max

      - name: Pull client CI test image
        id: pull-client-ci-image
        if: needs.affected-test-plan.outputs.mcp_conformance_mode != 'skip' && steps.test-image-inputs.outputs.client_changed != 'true'
        continue-on-error: true
        env:
          CLIENT_CI_IMAGE_REF: ${{ env.REGISTRY }}/${{ env.CI_CLIENT_TEST_IMAGE }}:main
        run: |
          docker pull "$CLIENT_CI_IMAGE_REF"
          docker tag "$CLIENT_CI_IMAGE_REF" bifrost-test-client-dev:latest

      - name: Build client dev image
        if: needs.affected-test-plan.outputs.mcp_conformance_mode != 'skip' && (steps.test-image-inputs.outputs.client_changed == 'true' || steps.pull-client-ci-image.outcome == 'failure' || steps.pull-client-ci-image.outcome == 'skipped')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./client
          file: ./client/Dockerfile.dev
          load: true
          tags: bifrost-test-client-dev:latest
          cache-from: type=gha,scope=test-client-dev
          cache-to: type=gha,scope=test-client-dev,mode=max

      - name: Remove registry credentials
        if: needs.affected-test-plan.outputs.mcp_conformance_mode != 'skip'
        run: docker logout "$REGISTRY"

      - name: Run blocking MCP conformance
        if: needs.affected-test-plan.outputs.mcp_conformance_mode != 'skip'
        env:
          BIFROST_SKIP_BUILD: "1"
        run: |
          chmod +x test.sh
          ./test.sh stack up
          ./test.sh mcp conformance

      - name: Upload MCP conformance results
        if: always() && needs.affected-test-plan.outputs.mcp_conformance_mode != 'skip'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-conformance-results
          path: /tmp/bifrost-*/mcp-conformance/
          if-no-files-found: error
          retention-days: 14

      - name: Tear down MCP conformance stack
        if: always() && needs.affected-test-plan.outputs.mcp_conformance_mode != 'skip'
        run: ./test.sh stack down

      - name: Report skipped MCP conformance lane
        if: needs.affected-test-plan.outputs.mcp_conformance_mode == 'skip'
        run: echo "MCP protocol surfaces are outside the affected closure."

  # =============================================================================
  # E2E Tests - Sharded across 4 parallel runners. Each shard boots its own
  # isolated test stack (no xdist, no shared services between shards).
  # scripts/e2e_shard.py deterministically allocates test files: heavies
  # bin-packed first, then round-robin in sorted order — adding a file only
  # moves files in shards downstream of the insertion point.
  #
  # The internal matrix job (test-e2e) uses shard names like
  # "E2E Tests (shard 1/4)". The aggregate gate job below (test-e2e-gate)
  # is named EXACTLY "E2E Tests" to match the required status check name —
  # no ruleset edits needed.
  # =============================================================================
  test-e2e:
    needs: affected-test-plan
    if: always()
    runs-on: ubuntu-latest
    name: E2E Tests (shard ${{ matrix.shard }}/${{ matrix.total }})
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.affected-test-plan.outputs.api_e2e_matrix || '{"include":[{"shard":0,"total":0}]}') }}
    steps:
      - name: Require a valid affected test plan
        if: needs.affected-test-plan.result != 'success'
        run: |
          echo "Affected test planning failed or was cancelled." >&2
          exit 1

      - name: Checkout repository
        if: matrix.total != 0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        if: matrix.total != 0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: matrix.total != 0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect test image input changes
        if: matrix.total != 0
        id: test-image-inputs
        run: bash scripts/ci/detect-test-image-inputs.sh

      - name: Pull API CI test image
        id: pull-api-ci-image
        if: matrix.total != 0 && steps.test-image-inputs.outputs.api_changed != 'true'
        continue-on-error: true
        env:
          API_CI_IMAGE_REF: ${{ env.REGISTRY }}/${{ env.CI_API_TEST_IMAGE }}:main
        run: |
          docker pull "$API_CI_IMAGE_REF"
          docker tag "$API_CI_IMAGE_REF" bifrost-test-api-dev:latest

      - name: Build API dev image
        if: matrix.total != 0 && (steps.test-image-inputs.outputs.api_changed == 'true' || steps.pull-api-ci-image.outcome == 'failure' || steps.pull-api-ci-image.outcome == 'skipped')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./api/Dockerfile.dev
          load: true
          tags: bifrost-test-api-dev:latest
          cache-from: type=gha,scope=test-api-dev
          cache-to: type=gha,scope=test-api-dev,mode=max

      - name: Pull client CI test image
        id: pull-client-ci-image
        if: matrix.total != 0 && steps.test-image-inputs.outputs.client_changed != 'true'
        continue-on-error: true
        env:
          CLIENT_CI_IMAGE_REF: ${{ env.REGISTRY }}/${{ env.CI_CLIENT_TEST_IMAGE }}:main
        run: |
          docker pull "$CLIENT_CI_IMAGE_REF"
          docker tag "$CLIENT_CI_IMAGE_REF" bifrost-test-client-dev:latest

      - name: Build client dev image
        if: matrix.total != 0 && (steps.test-image-inputs.outputs.client_changed == 'true' || steps.pull-client-ci-image.outcome == 'failure' || steps.pull-client-ci-image.outcome == 'skipped')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./client
          file: ./client/Dockerfile.dev
          load: true
          tags: bifrost-test-client-dev:latest
          cache-from: type=gha,scope=test-client-dev
          cache-to: type=gha,scope=test-client-dev,mode=max

      - name: Run E2E tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        if: matrix.total != 0
        env:
          BIFROST_SKIP_BUILD: "1"
          SHARD_ID: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ matrix.total }}
          TEST_MODE: ${{ needs.affected-test-plan.outputs.api_e2e_mode }}
          TEST_TARGETS: ${{ needs.affected-test-plan.outputs.api_e2e_targets }}
        run: |
          chmod +x test.sh
          ./test.sh stack up
          if [ "$TEST_MODE" = "comprehensive" ]; then
            mapfile -t shard_files < <(python3 scripts/e2e_shard.py --shard-id "$SHARD_ID" --total "$SHARD_TOTAL")
          else
            mapfile -t shard_files <<< "$TEST_TARGETS"
          fi
          if [ ${#shard_files[@]} -eq 0 ]; then
            echo "ERROR: shard $SHARD_ID resolved to zero files" >&2
            exit 1
          fi
          echo "Shard $SHARD_ID/$SHARD_TOTAL: ${#shard_files[@]} files"
          if [ "$TEST_MODE" = "comprehensive" ]; then
            ./test.sh "${shard_files[@]}" -v --durations=50 \
              --cov=. --cov-report=xml:/coverage/coverage-e2e-${{ matrix.shard }}.xml
            ./test.sh coverage coverage-e2e-${{ matrix.shard }}.xml
          else
            ./test.sh "${shard_files[@]}" -v --durations=50
          fi

      - name: Upload E2E coverage to Codecov
        if: needs.affected-test-plan.outputs.api_e2e_mode == 'comprehensive'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage-e2e-${{ matrix.shard }}.xml
          flags: api-e2e
          name: api-e2e-coverage-${{ matrix.shard }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Report skipped API e2e lane
        if: matrix.total == 0
        run: echo "API e2e tests are outside the affected closure."

  # =============================================================================
  # Client E2E Tests - Playwright browser coverage in the Docker test stack.
  # Source and specs are bind-mounted from the checkout; dependency-heavy
  # API, client, and browser images are pulled from main or rebuilt with
  # persistent BuildKit caches when their baked inputs change.
  # =============================================================================
  test-client-e2e:
    needs: affected-test-plan
    if: always()
    runs-on: ubuntu-latest
    name: Client E2E Tests
    permissions:
      contents: read
      packages: read
    env:
      BIFROST_SKIP_BUILD: "1"
      PLAYWRIGHT_RESULTS_MOUNT: ${{ github.workspace }}/client/playwright-results
    steps:
      - name: Require a valid affected test plan
        if: needs.affected-test-plan.result != 'success'
        run: |
          echo "Affected test planning failed or was cancelled." >&2
          exit 1

      - name: Checkout repository
        if: needs.affected-test-plan.outputs.client_e2e_mode != 'skip'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        if: needs.affected-test-plan.outputs.client_e2e_mode != 'skip'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: needs.affected-test-plan.outputs.client_e2e_mode != 'skip'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect test image input changes
        if: needs.affected-test-plan.outputs.client_e2e_mode != 'skip'
        id: test-image-inputs
        run: bash scripts/ci/detect-test-image-inputs.sh

      - name: Pull API CI test image
        id: pull-api-ci-image
        if: needs.affected-test-plan.outputs.client_e2e_mode != 'skip' && steps.test-image-inputs.outputs.api_changed != 'true'
        continue-on-error: true
        env:
          API_CI_IMAGE_REF: ${{ env.REGISTRY }}/${{ env.CI_API_TEST_IMAGE }}:main
        run: |
          docker pull "$API_CI_IMAGE_REF"
          docker tag "$API_CI_IMAGE_REF" bifrost-test-api-dev:latest

      - name: Build API dev image
        if: needs.affected-test-plan.outputs.client_e2e_mode != 'skip' && (steps.test-image-inputs.outputs.api_changed == 'true' || steps.pull-api-ci-image.outcome == 'failure' || steps.pull-api-ci-image.outcome == 'skipped')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./api/Dockerfile.dev
          load: true
          tags: bifrost-test-api-dev:latest
          cache-from: type=gha,scope=test-api-dev
          cache-to: type=gha,scope=test-api-dev,mode=max

      - name: Pull client CI test image
        id: pull-client-ci-image
        if: needs.affected-test-plan.outputs.client_e2e_mode != 'skip' && steps.test-image-inputs.outputs.client_changed != 'true'
        continue-on-error: true
        env:
          CLIENT_CI_IMAGE_REF: ${{ env.REGISTRY }}/${{ env.CI_CLIENT_TEST_IMAGE }}:main
        run: |
          docker pull "$CLIENT_CI_IMAGE_REF"
          docker tag "$CLIENT_CI_IMAGE_REF" bifrost-test-client-dev:latest

      - name: Build client dev image
        if: needs.affected-test-plan.outputs.client_e2e_mode != 'skip' && (steps.test-image-inputs.outputs.client_changed == 'true' || steps.pull-client-ci-image.outcome == 'failure' || steps.pull-client-ci-image.outcome == 'skipped')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./client
          file: ./client/Dockerfile.dev
          load: true
          tags: bifrost-test-client-dev:latest
          cache-from: type=gha,scope=test-client-dev
          cache-to: type=gha,scope=test-client-dev,mode=max

      - name: Pull Playwright CI test image
        id: pull-playwright-ci-image
        if: needs.affected-test-plan.outputs.client_e2e_mode != 'skip' && steps.test-image-inputs.outputs.playwright_changed != 'true'
        continue-on-error: true
        env:
          PLAYWRIGHT_CI_IMAGE_REF: ${{ env.REGISTRY }}/${{ env.CI_PLAYWRIGHT_TEST_IMAGE }}:main
        run: |
          docker pull "$PLAYWRIGHT_CI_IMAGE_REF"
          docker tag "$PLAYWRIGHT_CI_IMAGE_REF" bifrost-test-playwright-runner:latest

      - name: Build Playwright test image
        if: needs.affected-test-plan.outputs.client_e2e_mode != 'skip' && (steps.test-image-inputs.outputs.playwright_changed == 'true' || steps.pull-playwright-ci-image.outcome == 'failure' || steps.pull-playwright-ci-image.outcome == 'skipped')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./client
          file: ./client/Dockerfile.playwright
          load: true
          tags: bifrost-test-playwright-runner:latest
          cache-from: type=gha,scope=test-playwright
          cache-to: type=gha,scope=test-playwright,mode=max

      - name: Run Playwright tests
        if: needs.affected-test-plan.outputs.client_e2e_mode != 'skip'
        env:
          TEST_MODE: ${{ needs.affected-test-plan.outputs.client_e2e_mode }}
          TEST_TARGETS: ${{ needs.affected-test-plan.outputs.client_e2e_targets }}
        run: |
          mkdir -p client/playwright-results
          chmod 777 client/playwright-results
          chmod +x test.sh
          ./test.sh stack up
          if [ "$TEST_MODE" = "comprehensive" ]; then
            ./test.sh client e2e
          else
            mapfile -t targets <<< "$TEST_TARGETS"
            if (( ${#targets[@]} == 0 )); then
              echo "Affected client e2e lane has no targets." >&2
              exit 1
            fi
            ./test.sh client e2e "${targets[@]}"
          fi

      - name: Upload Playwright failure artifacts
        if: failure() && needs.affected-test-plan.outputs.client_e2e_mode != 'skip'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: client/playwright-results
          if-no-files-found: warn
          retention-days: 7

      - name: Report skipped client e2e lane
        if: needs.affected-test-plan.outputs.client_e2e_mode == 'skip'
        run: echo "Client browser tests are outside the affected closure."

  # Aggregate gate — required check named "E2E Tests" (matches ruleset 15329014).
  # Fails if any backend shard or the Playwright job failed or was cancelled.
  # (if: always()) so branch protection always sees a conclusive result.
  test-e2e-gate:
    if: always()
    needs: [affected-test-plan, test-e2e, test-client-e2e, mcp-conformance]
    runs-on: ubuntu-latest
    name: E2E Tests
    steps:
      - name: Check shard results
        run: |
          if [ "${{ needs.affected-test-plan.result }}" != "success" ]; then
            echo "Affected test planning failed or was cancelled (result: ${{ needs.affected-test-plan.result }})"
            exit 1
          fi
          if [ "${{ needs.test-e2e.result }}" != "success" ]; then
            echo "One or more e2e shards failed or were cancelled (result: ${{ needs.test-e2e.result }})"
            exit 1
          fi
          if [ "${{ needs.test-client-e2e.result }}" != "success" ]; then
            echo "Client e2e tests failed or were cancelled (result: ${{ needs.test-client-e2e.result }})"
            exit 1
          fi
          if [ "${{ needs.mcp-conformance.result }}" != "success" ]; then
            echo "MCP conformance failed or was cancelled (result: ${{ needs.mcp-conformance.result }})"
            exit 1
          fi
          echo "Every selected backend e2e, client Playwright, and MCP conformance lane passed or was explicitly outside the affected closure."

  # =============================================================================
  # Dev Build - Every push to main, gated by unit tests only
  # =============================================================================
  build-dev:
    # Only fires on push: main — branch protection + merge queue
    # already gated this commit, so no needs: here.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Build Dev Images
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC for keyless cosign signing
      attestations: write # for actions/attest-build-provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          VERSION=$(./scripts/compute-dev-version.sh)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # Surface manifest drift to the job summary. Plugin manifests are updated
      # at tag time (see bifrost-release skill) — between tags the `version`
      # field reflects the last released version, not the current dev version.
      # This step is informational only; it does not fail the build and does
      # not commit anything back. See PR #246 for the rationale (branch
      # protection + commit-back loop avoidance).
      - name: Report plugin manifest drift
        run: |
          DEV_VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## Plugin manifest versions"
            echo ""
            echo "- Computed dev version: \`${DEV_VERSION}\`"
            for manifest in \
              .claude-plugin/plugin.json \
              .codex-plugin/plugin.json \
              plugins/bifrost/.codex-plugin/plugin.json; do
              manifest_version=$(jq -r '.version' "$manifest")
              echo "- Manifest (${manifest}): \`${manifest_version}\`"
            done
            echo ""
            echo "Manifests reflect the last tagged release; they advance at tag time via the bifrost-release skill."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push API dev image
        id: build-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.API_IMAGE }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.API_IMAGE }}:dev
            ghcr.io/${{ env.API_IMAGE }}:sha-${{ steps.version.outputs.short_sha }}
          build-args: |
            BIFROST_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign API dev image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            ghcr.io/${{ env.API_IMAGE }}@${{ steps.build-api.outputs.digest }}

      - name: Attest API dev image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ env.API_IMAGE }}
          subject-digest: ${{ steps.build-api.outputs.digest }}
          push-to-registry: true

      - name: Build and push worker dev image
        id: build-worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.WORKER_IMAGE }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.WORKER_IMAGE }}:dev
            ghcr.io/${{ env.WORKER_IMAGE }}:sha-${{ steps.version.outputs.short_sha }}
          build-args: |
            BIFROST_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign worker dev image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            ghcr.io/${{ env.WORKER_IMAGE }}@${{ steps.build-worker.outputs.digest }}

      - name: Attest worker dev image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ env.WORKER_IMAGE }}
          subject-digest: ${{ steps.build-worker.outputs.digest }}
          push-to-registry: true

      - name: Build and push client dev image
        id: build-client
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./client
          file: ./client/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.CLIENT_IMAGE }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.CLIENT_IMAGE }}:dev
            ghcr.io/${{ env.CLIENT_IMAGE }}:sha-${{ steps.version.outputs.short_sha }}
          build-args: |
            VITE_BIFROST_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign client dev image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            ghcr.io/${{ env.CLIENT_IMAGE }}@${{ steps.build-client.outputs.digest }}

      - name: Attest client dev image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ env.CLIENT_IMAGE }}
          subject-digest: ${{ steps.build-client.outputs.digest }}
          push-to-registry: true

      # ---------------------------------------------------------------------------
      # Transitional dual-publish to legacy ghcr.io/jackmusick/* namespace.
      # This keeps Keel-polling clusters that pin the old image name converging
      # during the migration window. Sunset: remove after 2 stable releases or
      # 60 days post-transfer to gobifrost, whichever comes first.
      # ---------------------------------------------------------------------------
      - name: Dual-publish dev images to legacy jackmusick namespace
        # Map secret to env var so job-level if-condition can test it
        # (secrets cannot be referenced directly in job if-conditions).
        env:
          GHCR_LEGACY_TOKEN: ${{ secrets.GHCR_LEGACY_TOKEN }}
        if: ${{ env.GHCR_LEGACY_TOKEN != '' }}
        run: |
          echo "$GHCR_LEGACY_TOKEN" | docker login ghcr.io -u jackmusick --password-stdin

          # Retag and push API dev images to legacy namespace
          for tag in \
            "${{ steps.version.outputs.version }}" \
            "dev" \
            "sha-${{ steps.version.outputs.short_sha }}"; do
            docker pull ghcr.io/${{ env.API_IMAGE }}:${tag}
            docker tag  ghcr.io/${{ env.API_IMAGE }}:${tag} ghcr.io/${{ env.LEGACY_API_IMAGE }}:${tag}
            docker push ghcr.io/${{ env.LEGACY_API_IMAGE }}:${tag}
          done

          # Retag and push Client dev images to legacy namespace
          for tag in \
            "${{ steps.version.outputs.version }}" \
            "dev" \
            "sha-${{ steps.version.outputs.short_sha }}"; do
            docker pull ghcr.io/${{ env.CLIENT_IMAGE }}:${tag}
            docker tag  ghcr.io/${{ env.CLIENT_IMAGE }}:${tag} ghcr.io/${{ env.LEGACY_CLIENT_IMAGE }}:${tag}
            docker push ghcr.io/${{ env.LEGACY_CLIENT_IMAGE }}:${tag}
          done

          docker logout ghcr.io

  # =============================================================================
  # Deploy Dry Run - Manual trigger only (workflow_dispatch from any branch).
  # Validates the DO auth chain (token, cluster name, RBAC, label selector)
  # WITHOUT touching any deployment. Used once before merging this PR to
  # confirm the deploy job will succeed when it fires for real.
  # =============================================================================
  deploy-dry-run:
    if: github.repository == 'gobifrost/bifrost' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Deploy Dry Run
    permissions:
      contents: read
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save kubeconfig
        env:
          DO_CLUSTER_NAME: ${{ secrets.DO_CLUSTER_NAME }}
        run: doctl kubernetes cluster kubeconfig save "$DO_CLUSTER_NAME"

      - name: Probe cluster reach + RBAC + label selector
        run: |
          set -e
          echo "::group::cluster info"
          kubectl cluster-info
          echo "::endgroup::"

          echo "::group::RBAC — can I patch deployments in the bifrost namespace?"
          kubectl auth can-i patch deployment -n bifrost
          echo "::endgroup::"

          echo "::group::Deployments the real job would restart"
          kubectl -n bifrost get deployment \
            -l app.kubernetes.io/part-of=bifrost,app.kubernetes.io/component!=message-broker \
            -o wide
          echo "::endgroup::"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Bifrost deploy dry run"
            echo ""
            echo "If the step above passed, the real \`deploy-dev\` job will work when this PR merges."
            echo ""
            echo "### Deployments that would be restarted"
            echo ""
            echo '```'
            kubectl -n bifrost get deployment \
              -l app.kubernetes.io/part-of=bifrost,app.kubernetes.io/component!=message-broker \
              -o custom-columns=NAME:.metadata.name,READY:.status.readyReplicas,AVAILABLE:.status.availableReplicas \
              || echo "kubectl unavailable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # Deploy Dev - upstream-only. MTG-Thomas deploys from bifrost-infra to Azure,
  # so fork image promotion must not be blocked by upstream DigitalOcean wiring.
  # In gobifrost/bifrost this rolls the DigitalOcean deployment once the :dev
  # images are published. Targets anything labeled
  # `app.kubernetes.io/part-of=bifrost` in the `bifrost` namespace so new
  # services are picked up automatically. Failures page the maintainer via
  # GitHub's built-in workflow-failure email (no extra wiring).
  # =============================================================================
  deploy-dev:
    # Fires only after build-dev lands a new image on push: main.
    if: github.repository == 'gobifrost/bifrost' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-dev]
    runs-on: ubuntu-latest
    name: Deploy Dev to DigitalOcean
    permissions:
      contents: read
    # Allow only one deploy at a time; if a newer commit lands mid-rollout we
    # cancel the older deploy so the cluster always converges on HEAD of main.
    concurrency:
      group: deploy-dev
      cancel-in-progress: true

    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save kubeconfig
        env:
          DO_CLUSTER_NAME: ${{ secrets.DO_CLUSTER_NAME }}
        run: doctl kubernetes cluster kubeconfig save "$DO_CLUSTER_NAME"

      - name: Roll deployments
        run: |
          kubectl -n bifrost rollout restart deployment \
            -l app.kubernetes.io/part-of=bifrost,app.kubernetes.io/component!=message-broker

      - name: Wait for rollouts
        run: |
          set -e
          # Query the same label selector we restarted, so new services are
          # picked up without editing this workflow.
          DEPLOYMENTS=$(kubectl -n bifrost get deployment \
            -l app.kubernetes.io/part-of=bifrost,app.kubernetes.io/component!=message-broker \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
          for d in $DEPLOYMENTS; do
            echo "::group::rollout status $d"
            kubectl -n bifrost rollout status "deployment/$d" --timeout=5m
            echo "::endgroup::"
          done

      - name: Summary
        if: always()
        env:
          DO_CLUSTER_NAME: ${{ secrets.DO_CLUSTER_NAME }}
        run: |
          {
            echo "## Bifrost deploy"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Cluster: \`$DO_CLUSTER_NAME\`"
            echo "- Namespace: \`bifrost\`"
            echo ""
            echo "### Deployment status"
            echo ""
            kubectl -n bifrost get deployment \
              -l app.kubernetes.io/part-of=bifrost,app.kubernetes.io/component!=message-broker \
              -o custom-columns=NAME:.metadata.name,READY:.status.readyReplicas,AVAILABLE:.status.availableReplicas,UPDATED:.status.updatedReplicas \
              || echo "kubectl unavailable"
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # Release Manifest Check - Fail before any tag image is published
  # =============================================================================
  verify-release-manifest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-unit, test-e2e-gate, lint, mcp-conformance]
    runs-on: ubuntu-latest
    name: Verify Release Manifest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Release tag '${GITHUB_REF#refs/tags/}' must be strict semver like v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # Hard guard: plugin manifest versions must match the tag, otherwise
      # Claude Code and Codex plugin marketplaces can keep serving stale skill
      # content to users who installed via this repo. The bifrost-release skill
      # runs `scripts/update-plugin-version.sh <version>` locally before
      # tagging, so when this fails the maintainer either forgot the skill step
      # or the bump commit didn't make it onto the tagged ref.
      - name: Verify plugin manifest matches tag
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          failed=0
          for manifest in \
            .claude-plugin/plugin.json \
            .codex-plugin/plugin.json \
            plugins/bifrost/.codex-plugin/plugin.json; do
            manifest_version=$(jq -r '.version' "$manifest")
            if [[ "$manifest_version" != "$TAG_VERSION" ]]; then
              echo "::error::${manifest} version (${manifest_version}) does not match tag (${TAG_VERSION})."
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "::error::Run 'scripts/update-plugin-version.sh $TAG_VERSION' on main, commit, then re-tag."
            exit 1
          fi

  # =============================================================================
  # Build API Image - Only on version tags, after tests pass
  # =============================================================================
  build-api:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-release-manifest]
    runs-on: ubuntu-latest
    name: Build API Image
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC for keyless cosign signing
      attestations: write # for actions/attest-build-provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Compute version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Release tag '${GITHUB_REF#refs/tags/}' must be strict semver like v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}
          tags: |
            # Semantic version tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # SHA for traceability
            type=sha
            # Latest tag only on stable releases (not pre-releases like v1.0.0-beta)
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BIFROST_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign API image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            ghcr.io/${{ env.API_IMAGE }}@${{ steps.build-api.outputs.digest }}

      - name: Attest API image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ env.API_IMAGE }}
          subject-digest: ${{ steps.build-api.outputs.digest }}
          push-to-registry: true

      # ---------------------------------------------------------------------------
      # Transitional dual-publish to legacy ghcr.io/jackmusick/* namespace.
      # Sunset: remove after 2 stable releases or 60 days post-transfer.
      # ---------------------------------------------------------------------------
      - name: Dual-publish API release image to legacy jackmusick namespace
        env:
          GHCR_LEGACY_TOKEN: ${{ secrets.GHCR_LEGACY_TOKEN }}
        if: ${{ env.GHCR_LEGACY_TOKEN != '' }}
        run: |
          echo "$GHCR_LEGACY_TOKEN" | docker login ghcr.io -u jackmusick --password-stdin
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' '); do
            legacy_tag=$(echo "$tag" | sed "s|ghcr.io/${{ env.API_IMAGE }}|ghcr.io/${{ env.LEGACY_API_IMAGE }}|")
            docker pull "$tag"
            docker tag  "$tag" "$legacy_tag"
            docker push "$legacy_tag"
          done
          docker logout ghcr.io

