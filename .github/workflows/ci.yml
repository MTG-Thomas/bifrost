  # =============================================================================
  # Create GitHub Release - Only on version tags, after images are built.
  # Release assets are signed with Sigstore/cosign (keyless OIDC) and a SLSA
  # build provenance attestation is generated via GitHub's native attestation
  # action. Both feed Scorecard's Signed-Releases check.
  # =============================================================================
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-api, build-client, build-worker]
    runs-on: ubuntu-latest
    name: Create Release
    permissions:
      contents: write       # upload assets to the GitHub Release
      id-token: write       # OIDC token for keyless cosign signing
      attestations: write   # actions/attest-build-provenance writes attestations

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version from tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          IMAGE_TAG="${VERSION#v}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          # Check if this is a pre-release (contains hyphen like v1.0.0-beta)
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Copy type stubs
        run: |
          if [ -f "stubs/bifrost.pyi" ]; then
            cp stubs/bifrost.pyi bifrost.pyi
          else
            echo "Warning: bifrost.pyi not found in stubs/, skipping"
          fi

      # Produce a reproducible source tarball as a primary release artifact so
      # Scorecard's Signed-Releases check has something concrete to verify
      # against (it ignores tag-only releases).
      - name: Build source tarball
        id: source_tarball
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TARBALL="bifrost-${VERSION}-source.tar.gz"
          git archive --format=tar.gz --prefix="bifrost-${VERSION}/" -o "${TARBALL}" HEAD
          sha256sum "${TARBALL}" | tee "${TARBALL}.sha256"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.1

      # Keyless OIDC signing: cosign exchanges the GitHub Actions OIDC token
      # for a short-lived Fulcio cert, signs, and records the signature in
      # Rekor. The .sigstore bundle is the format Scorecard's Signed-Releases
      # check recognizes (alongside .sig, .asc, .minisig, .sign).
      - name: Sign release artifacts with cosign
        run: |
          set -euo pipefail
          ARTIFACTS=("${{ steps.source_tarball.outputs.tarball }}")
          if [ -f "bifrost.pyi" ]; then
            ARTIFACTS+=("bifrost.pyi")
          fi
          for f in "${ARTIFACTS[@]}"; do
            cosign sign-blob --yes \
              --bundle "${f}.sigstore" \
              "${f}"
          done

      # SLSA build provenance — stored in GitHub's transparency log and
      # discoverable via `gh attestation verify`. Independent signal from the
      # cosign blob signatures above.
      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.source_tarball.outputs.tarball }}

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          files: |
            ${{ steps.source_tarball.outputs.tarball }}
            ${{ steps.source_tarball.outputs.tarball }}.sha256
            ${{ steps.source_tarball.outputs.tarball }}.sigstore
            bifrost.pyi
            bifrost.pyi.sigstore
            stubs/DISTRIBUTION.md
          fail_on_unmatched_files: false
          body: |
            ## Bifrost ${{ steps.get_version.outputs.version }}

            ### Highlights

            - Immutable Solution deployments with compare-and-swap activation and runtime pinning.
            - Standalone v2 applications, SDK streaming, and a more capable local development workflow.
            - Security hardening across authentication, multi-tenancy boundaries, path containment, and dependency supply chains.
            - Expanded diagnostics, OpenTelemetry coverage, and worker-capacity controls.

            ### Upgrade notes

            This is a major-version release candidate. The legacy `bifrost export` and
            `bifrost import` commands have been removed; Solutions are their
            lifecycle-aware replacement. CLI consumers must use a CLI build matching
            the server contract version.

            ### Contributors

            Thomas Bray, Jack Musick, and Paul Szatkowski.

            ### Docker Images

            **API:**
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ steps.get_version.outputs.image_tag }}
            ```

            **Client:**
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE }}:${{ steps.get_version.outputs.image_tag }}
            ```

            **Worker:**
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}:${{ steps.get_version.outputs.image_tag }}
            ```

            ### Type Stubs for IDEs
            Download `bifrost.pyi` from the assets below and place it in your workspace directory for IDE autocomplete and type checking support.

            See `DISTRIBUTION.md` for instructions.

            ### Signed artifacts (Sigstore / cosign — keyless)

            Each release asset has a matching `.sigstore` bundle (Sigstore's
            self-contained signature + certificate + Rekor inclusion proof,
            produced via keyless OIDC — no maintainer-held keys involved).

            Verify with cosign (>= v2.4):

            ```bash
            cosign verify-blob \
              --bundle bifrost-${{ steps.get_version.outputs.version }}-source.tar.gz.sigstore \
              --certificate-identity-regexp 'https://github\.com/${{ github.repository }}/.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              bifrost-${{ steps.get_version.outputs.version }}-source.tar.gz
            ```

            A SLSA build-provenance attestation is also published and verifiable via:

            ```bash
            gh attestation verify bifrost-${{ steps.get_version.outputs.version }}-source.tar.gz \
              --owner ${{ github.repository_owner }}
            ```

          # Immutable releases only accept asset uploads while they are drafts.
          # Publish in the next step after every asset has been uploaded.
          draft: true
          prerelease: ${{ steps.get_version.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
          PRERELEASE: ${{ steps.get_version.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--draft=false)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release edit "$VERSION" "${args[@]}"
