# Docs-only PRs skip real CI (ci.yml paths-ignore). These noop jobs report
# the same status-check names as ci.yml so branch protection still passes.
#
# The `paths:` list MUST stay byte-identical to ci.yml's `paths-ignore:`.

name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.svg"
      - "**/*.webp"
      - "**/*.ico"
      - ".agents/**"
      - ".claude/**"
      - ".claude-plugin/**"
      - ".codex/**"
      - ".codex-plugin/**"
      - "docs/**"
      - "LICENSE"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - ".prettierrc*"
      - ".prettierignore"
      - ".vscode/**"
      - ".idea/**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint & Type Check
    steps:
      - run: echo "Docs-only change — real lint runs from ci.yml when code changes."

  test-unit:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - run: echo "Docs-only change — real unit tests run from ci.yml when code changes."

  test-e2e:
    runs-on: ubuntu-latest
    name: E2E Tests
    steps:
      - run: echo "Docs-only change — real E2E tests run from ci.yml when code changes."
