# Docs-only PR notice. These jobs intentionally do not share required CI
# status-check names; real CI runs for every pull request.

name: Docs-only CI Notice

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.svg"
      - "**/*.webp"
      - "**/*.ico"
      - ".agents/**"
      - ".claude/**"
      - ".claude-plugin/**"
      - ".codex/**"
      - ".codex-plugin/**"
      - "docs/**"
      - "LICENSE"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - ".prettierrc*"
      - ".prettierignore"
      - ".vscode/**"
      - ".idea/**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Docs-only Lint Notice
    steps:
      - run: echo "Docs-only change — real lint runs from ci.yml when code changes."

  test-unit:
    runs-on: ubuntu-latest
    name: Docs-only Unit Notice
    steps:
      - run: echo "Docs-only change — real unit tests run from ci.yml when code changes."

  test-e2e:
    runs-on: ubuntu-latest
    name: Docs-only E2E Notice
    steps:
      - run: echo "Docs-only change — real E2E tests run from ci.yml when code changes."
