name: CodSpeed

on:
  push:
    branches:
      - "main"
  pull_request:
  # Allow CodSpeed to trigger backtest performance analysis
  workflow_dispatch:

permissions:
  contents: read # Public repository uploads do not require OIDC or an upload token.

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            .github/requirements/codspeed.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --require-hashes -r requirements.lock
          ./.venv/bin/pip install --no-deps --require-hashes -r .github/requirements/codspeed.txt

      - name: Run benchmarks
        uses: CodSpeedHQ/action@9c498abf90f466ace8338cd5505d6ab277e1f9a3 # v4.19.0
        with:
          mode: simulation
          run: cd api && PYTHONPATH=. ../.venv/bin/python -m pytest benchmarks/ --codspeed
