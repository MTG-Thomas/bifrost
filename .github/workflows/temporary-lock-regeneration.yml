name: Temporary lock regeneration

on:
  push:
    branches: [codex/affected-platform-ci]

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regenerate Python 3.14 lock
        run: |
          docker run --rm -v "$PWD":/repo -w /repo python:3.14-slim sh -c "
            pip install --quiet --require-hashes -r requirements-piptools.lock
            pip-compile --generate-hashes --output-file=requirements.lock pyproject.toml
          "
      - name: Upload regenerated lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regenerated-requirements-lock
          path: requirements.lock
          if-no-files-found: error
          retention-days: 1
