name: Fuzzing

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  property-tests:
    runs-on: ubuntu-latest
    name: Property Tests
    concurrency:
      group: ${{ github.workflow }}-property-tests
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --require-hashes -r requirements.lock

      - name: Python property tests
        working-directory: api
        env:
          BIFROST_FUZZ_EXAMPLES: "10000"
          BIFROST_REGEX_VALIDATION_FUZZ_EXAMPLES: "10000"
          BIFROST_REGEX_SEARCH_FUZZ_EXAMPLES: "5000"
        run: ../.venv/bin/pytest tests/unit/services/test_editor_search.py -m property

      - name: Python fuzz corpus harnesses
        working-directory: api
        run: ../.venv/bin/python -m fuzz.runner

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: TypeScript property tests
        working-directory: client
        env:
          BIFROST_FAST_CHECK_RUNS: "100000"
        run: npm test -- --run src/lib/api-error.property.test.ts
